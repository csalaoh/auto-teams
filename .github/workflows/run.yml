name: Teams and Task Summary

on:
  schedule:
    - cron: '0 16 * * 1-5'  # Hétfőtől péntekig minden nap 16:00 UTC-kor (télen/nyáron igazítsd az időzónához)
  workflow_dispatch: # Engedélyezi a kézi indítást is a GitHub felületéről teszteléshez

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Python környezet beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Függőségek telepítése
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Szkript futtatása
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}  # Biztonságosan átadott kulcs
        run: |
          python script.py